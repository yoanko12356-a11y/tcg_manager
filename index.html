<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCG Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="home-mode">

  <!-- ヘッダーエリア -->
  <header class="app-header">
    <div class="header-left">
      <h1 class="app-title" id="logo-home" style="cursor: pointer;">TCG Manager</h1>
    </div>
    
    <div class="header-center">
      <div class="search-box">
        <img src="images/icon-search.svg" alt="検索" class="search-icon" id="search-trigger-icon">
        <input type="text" id="search-input" placeholder="カード名、種族、型番で検索..." />
      </div>
    </div>

    <!-- ヘッダー右側エリア -->
    <div class="header-right">
      <!-- 検索画面のときだけヘッダー右側に表示されるナビボタン群 -->
      <div class="nav-buttons-group">
        <button class="header-nav-btn home-icon-style" id="header-home-btn" data-tab="home" title="ホーム">
          <img src="images/nav-home.svg" alt="ホーム" class="nav-icon-img">
          <span>ホーム</span>
        </button>
        <button class="header-nav-btn home-icon-style" data-tab="collection" title="コレクション">
          <img src="images/nav-collection.svg" alt="コレクション" class="nav-icon-img">
          <span>コレクション</span>
        </button>
        <button class="header-nav-btn home-icon-style" data-tab="deck" title="デッキ">
          <img src="images/nav-deck.svg" alt="デッキ" class="nav-icon-img">
          <span>デッキ</span>
        </button>
        <button class="header-nav-btn home-icon-style active" data-tab="search" id="nav-search-btn" title="検索">
          <img src="images/nav-search.svg" alt="検索" class="nav-icon-img">
          <span>検索</span>
        </button>
        <button class="header-nav-btn home-icon-style" data-tab="favorite" title="ほしいもの">
          <img src="images/nav-favorite.svg" alt="ほしいもの" class="nav-icon-img" id="favorite-icon">
          <span>ほしいもの</span>
        </button>
        <button class="header-nav-btn home-icon-style" data-tab="market" title="相場">
          <img src="images/nav-market.svg" alt="相場" class="nav-icon-img " id="market-icon">
          <span>相場</span>
        </button>
      </div>

      <!-- ユーザーアイコン -->
      <button class="user-btn">
        <img src="images/icon-user.svg" alt="ユーザー" class="user-icon">
      </button>
    </div>
  </header>

  <!-- ========================== -->
  <!-- ① ホーム画面ビュー -->
  <!-- ========================== -->
  <main class="main-container" id="home-view">

    <!-- ホーム画面用の左側アイコン配置エリア -->
    <div class="home-nav-bar">
      <button class="home-nav-item" data-tab="collection" title="コレクション">
        <img src="images/nav-collection.svg" alt="コレクション" class="nav-icon-img">
        <span>コレクション</span>
      </button>
      <button class="home-nav-item" data-tab="deck" title="デッキ">
        <img src="images/nav-deck.svg" alt="デッキ" class="nav-icon-img">
        <span>デッキ</span>
      </button>
      <button class="home-nav-item" data-tab="search" title="検索">
        <img src="images/nav-search.svg" alt="検索" class="nav-icon-img">
        <span>検索</span>
      </button>
      <button class="home-nav-item home-icon-style" data-tab="favorite" title="ほしいもの">
        <img src="images/nav-favorite.svg" alt="ほしいもの" class="nav-icon-img" id="favorite-icon">
        <span>ほしいもの</span>
      </button>
      <button class="home-nav-item home-icon-style" data-tab="market" title="相場">
        <img src="images/nav-market.svg" alt="相場" class="nav-icon-img" id="market-icon">
        <span>相場</span>
      </button>
    </div>

    <!-- 上昇ランキング -->
    <section class="ranking-section">
      <div class="section-header">
        <div class="header-left-group">
          <img src="images/icon-trend-up.svg" alt="上昇" class="title-icon">
          <h2 class="section-title">今日の上昇ランキング（コレクション・ほしいものリスト内）</h2>
        </div>
        <div class="section-actions">
          <span class="price-type-badge" id="price-type-label">買取価格</span>
          <button class="refresh-btn" id="toggle-price-btn" title="価格タイプを切り替え">
            <img src="images/icon-refresh.svg" alt="更新">
          </button>
        </div>
      </div>
      
      <div class="horizontal-card-list" id="up-ranking-list"></div>
    </section>

    <!-- 下落ランキング -->
    <section class="ranking-section">
      <div class="section-header">
        <div class="header-left-group">
          <img src="images/icon-trend-down.svg" alt="下落" class="title-icon">
          <h2 class="section-title">今日の下落ランキング（コレクション・ほしいものリスト内）</h2>
        </div>
      </div>
      
      <div class="horizontal-card-list" id="down-ranking-list"></div>
    </section>

  </main>


  <!-- ========================== -->
  <!-- ② 検索画面ビュー（初期は非表示） -->
  <!-- ========================== -->
  <main class="main-container" id="search-view" style="display: none;">
    
    <!-- 文明・特性フィルターアイコンの横並びエリア -->
   <!-- 検索画面の文明フィルターエリア -->
<!-- 検索画面の文明フィルターエリア（画像通りの右側サブ検索付き） -->
<div class="civ-filter-bar" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
  <div style="display: flex; gap: 8px; overflow-x: auto; align-items: center;">
    <button class="civ-btn" data-civ="光"><img src="images/icon-civ-light.svg" alt="光"></button>
    <button class="civ-btn" data-civ="水"><img src="images/icon-civ-water.svg" alt="水"></button>
    <button class="civ-btn" data-civ="火"><img src="images/icon-civ-fire.svg" alt="火"></button>
    <button class="civ-btn" data-civ="自然"><img src="images/icon-civ-nature.svg" alt="自然"></button>
    <button class="civ-btn" data-civ="闇"><img src="images/icon-civ-dark.svg" alt="闇"></button>
    <button class="civ-btn" data-civ="ゼロ"><img src="images/icon-civ-zero.svg" alt="ゼロ"></button>
    <button class="civ-btn" data-civ="多色"><img src="images/icon-civ-multi.svg" alt="多色"></button>
    <button class="civ-btn" data-civ="単色"><img src="images/icon-civ-monochrome.svg" alt="単色"></button>
    
    <!-- ★ここに文明ボタンの横に並ぶチェックボックスを追加！ -->
    <label style="display: inline-flex; align-items: center; gap: 4px; font-size: 0.95rem; color: #475569; cursor: pointer; white-space: nowrap; margin-left: 4px;">
      <input type="checkbox" id="uniqueModeCheckbox" style="cursor: pointer;"> 
      同名カードを1枚にまとめる
    </label>
    
    <label style="display: inline-flex; align-items: center; gap: 4px; font-size: 0.95rem; color: #475569; margin-left: 12px;">
    <span>選んだ文明:</span>
    <select id="civMatchMode" style="padding: 2px 4px; border-radius: 4px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; font-size: 0.9rem;">
    <option value="or">いずれか含む</option>
    <option value="and">すべて含む</option>
    </select>
    </label>

  </div>

  <!-- 右側のサブ検索エリア（テキスト・フリーワード＋オプションボタン） -->
  <div class="sub-search-container" style="display: flex; gap: 8px; align-items: center; background: #fff; padding: 4px 12px; border-radius: 20px; border: 1px solid #cbd5e1; position: relative;">
    <select id="sub-search-type" style="border: none; outline: none; background: transparent; font-size: 0.85rem; color: #475569; cursor: pointer;">
      <option value="text">テキスト</option>
      <option value="free">フリーワード</option>
    </select>
    <span style="color: #cbd5e1;">|</span>

    <!-- 入力欄（テキスト・フリーワード用） -->
    <div id="single-input-wrapper" style="display: flex; align-items: center;">
      <input type="text" id="sub-search-input" placeholder="検索ワードを入力..." style="border: none; outline: none; font-size: 0.85rem; width: 240px;" />
    </div>

    <!-- オプションメニューを開くボタン（歯車アイコンなど） -->
    <button id="filter-toggle-btn" style="border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px;" title="詳細オプション">
      <img src="images/filter-toggle-btn.svg" alt="フィルター" style="width: 24px; height: 24px; display: block;" />
    </button>

    <!-- 背景の暗幕（バックドロップ） ※まだ入れてなかったらヘッダーやモーダルの近くに置いてね -->
  <div id="options-backdrop"></div>

  <!-- 右からスライドしてくる詳細オプションメニュー -->
  <div id="options-popup">
    <div style="font-weight: bold; margin-bottom: 16px; font-size: 1.1rem; color: #1e293b; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px;">
      <span>詳細オプション</span>
      <button id="options-close-btn" style="border: none; background: transparent; cursor: pointer; font-size: 1.2rem; color: #64748b;">✕</button>
    </div>

    <!-- パワー範囲指定 -->
    <div style="margin-bottom: 16px;">
      <label style="font-size: 0.85rem; color: #64748b; display: block; margin-bottom: 6px; font-weight: bold;">パワー</label>
      <div style="display: flex; align-items: center; gap: 8px;">
        <input type="text" id="power-min-input" placeholder="指定なし" style="width: 100%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; text-align: center; background: #f8fafc; outline: none;" />
        <span style="font-size: 0.9rem; color: #666;">〜</span>
        <input type="text" id="power-max-input" placeholder="指定なし" style="width: 100%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; text-align: center; background: #f8fafc; outline: none;" />
      </div>
    </div>

    <!-- コスト範囲指定 -->
    <div>
      <label style="font-size: 0.85rem; color: #64748b; display: block; margin-bottom: 6px; font-weight: bold;">コスト</label>
      <div style="display: flex; align-items: center; gap: 8px;">
        <input type="text" id="cost-min-input" placeholder="指定なし" style="width: 100%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; text-align: center; background: #f8fafc; outline: none;" />
        <span style="font-size: 0.9rem; color: #666;">〜</span>
        <input type="text" id="cost-max-input" placeholder="指定なし" style="width: 100%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; text-align: center; background: #f8fafc; outline: none;" />
      </div>
    </div>
  </div>
  </div>
</div>

    <!-- 検索結果グリッド表示エリア -->
    <div class="search-grid-container" id="search-results-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; padding: 0 16px;">
    </div>

  </main>


  <!-- カード詳細・相場ポップアップ（モーダル） -->
  <div class="modal-overlay" id="card-modal">
    <div class="modal-content">
      <button class="modal-close-btn" id="modal-close-btn">&times;</button>
      
      <div class="modal-header">
        <img id="modal-card-img" src="" alt="カード画像" class="modal-card-image">
        <div class="modal-card-info">
          <h2 id="modal-card-title">カード名</h2>
          <p id="modal-card-code" class="modal-card-code">型番</p>
          <div class="modal-price-summary">
            <span class="price-label">現在相場:</span>
            <span id="modal-card-price" class="modal-price-val">¥0</span>
          </div>
        </div>
      </div>

      <!-- 平均価格・販売数のサマリー情報 -->
      <div class="modal-section" style="border-bottom: 1px solid #eee; padding-bottom: 12px; margin-bottom: 12px;">
        <div id="modal-summary-info" style="font-size: 0.9rem; color: #333;">
          <div>平均価格: <strong id="modal-avg-price" style="font-size: 1.1rem;">¥—</strong></div>
          <div style="color: #666; font-size: 0.85rem; margin-top: 2px;">販売数: <span id="modal-sales-count">—</span></div>
        </div>
      </div>

      <div class="modal-section">
        <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;">
          <!-- 期間切り替えボタン群 -->
          <div style="display: flex; gap: 4px; flex-wrap: wrap;">
            <button id="chart-btn-all" class="chart-filter-btn active" style="font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; border: none; background: #3b82f6; color: #fff; cursor: pointer;">全期間</button>
            <button id="chart-btn-90d" class="chart-filter-btn" style="font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; border: none; background: #f1f5f9; color: #666; cursor: pointer;">90日</button>
            <button id="chart-btn-60d" class="chart-filter-btn" style="font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; border: none; background: #f1f5f9; color: #666; cursor: pointer;">60日</button>
            <button id="chart-btn-30d" class="chart-filter-btn" style="font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; border: none; background: #f1f5f9; color: #666; cursor: pointer;">30日</button>
            <button id="chart-btn-7d" class="chart-filter-btn" style="font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; border: none; background: #f1f5f9; color: #666; cursor: pointer;">7日</button>
          </div>
        </div>
        
        <!-- グラフ描画用のcanvas -->
        <div style="position: relative; height: 160px; width: 100%;">
          <canvas id="priceChart"></canvas>
        </div>
      </div>

      <div class="modal-section">
        <h3>🛒 最安ショップ情報</h3>
        <ul class="shop-list">
          <li class="shop-item">
            <span class="shop-name">カードショップ A</span>
            <span class="shop-price">¥1,200</span>
            <a href="#" class="shop-link-btn" onclick="return false;">在庫あり</a>
          </li>
          <li class="shop-item">
            <span class="shop-name">トレカネット B</span>
            <span class="shop-price">¥1,280</span>
            <a href="#" class="shop-link-btn" onclick="return false;">在庫あり</a>
          </li>
          <li class="shop-item">
            <span class="shop-name">ホビーショップ C</span>
            <span class="shop-price">¥1,350</span>
            <a href="#" class="shop-link-btn" onclick="return false;">わずか</a>
          </li>
        </ul>
      </div>

    </div>
  </div>

  <!-- カード画像拡大用オーバーレイ -->
<div id="image-zoom-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; cursor: zoom-out;">
  <img id="zoomed-card-img" src="" alt="拡大画像" style="max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 26px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
</div>

  <script src="app.js"></script>
</body>
</html>
